name: publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish new version to TER
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::Tag $TAG is not a version number."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get comment
        id: get-comment
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          comment=''

          # Only annotated tags carry a message of their own. For a lightweight
          # tag %(contents) would return the commit message instead.
          if [[ "$(git cat-file -t "$VERSION")" == 'tag' ]]; then
            comment=$(git tag -l "$VERSION" --format '%(contents)')
          fi

          if [[ -z "${comment// }" ]]; then
            comment="Released version $VERSION"
          fi

          {
            echo 'comment<<TAG_COMMENT_EOF'
            echo "$comment"
            echo 'TAG_COMMENT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Install tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress

      - name: Publish to TER
        env:
          COMMENT: ${{ steps.get-comment.outputs.comment }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          "$(composer global config bin-dir --absolute)/tailor" ter:publish --comment "$COMMENT" "$VERSION"

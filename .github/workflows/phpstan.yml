name: PHPStan

on:
  pull_request:

jobs:
  phpstan:
    name: TYPO3 ${{ matrix.typo3 }} / ${{ matrix.dependencies.name }} dependencies
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        typo3: ['^13.0', '^14.0']
        dependencies:
          - { name: lowest, flags: '--prefer-lowest' }
          - { name: highest, flags: '' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Pin TYPO3 version
        run: composer require --no-update --no-interaction typo3/cms-core:"${{ matrix.typo3 }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies.flags }}

      - name: Run PHPStan level 4
        run: composer phpstan
